name: فحص

on:
  # كل الفروع لا main وحده — وإلا تعذّر التحقق قبل الدمج
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: اختبار الـ hooks
        run: bash tools/test-hooks.sh
      - name: اختبار دمج الإعدادات
        run: bash tools/test-merge.sh

  check-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: اختبار الذاكرة بطبقتين
        run: bash tools/test-memory-layers.sh
      - name: اختبار سلامة التركيب
        run: bash tools/test-install.sh
      - name: تركيب تجريبي في بيئة معزولة
        env:
          CLAUDE_CONFIG_DIR: /tmp/nizam-ci
        run: |
          bash install/install.sh --no-backup --skip-claude-check
          test -f "$CLAUDE_CONFIG_DIR/settings.json" || exit 1
          test -f "$CLAUDE_CONFIG_DIR/CLAUDE.md" || exit 1
          test -f "$CLAUDE_CONFIG_DIR/data/deepseek.db" || exit 1

  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: صحة بنية ملفات JavaScript
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" 2>/dev/null || { echo "✗ $f"; fail=1; }
          done < <(find . -name '*.js' -not -path './.git/*' -print0)
          exit $fail
      - name: صحة ملفات JSON
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" 2>/dev/null || { echo "✗ $f"; fail=1; }
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          exit $fail

  check-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: اختبار بوابات الـ workflows
        run: bash tools/test-workflow-guards.sh

  check-sprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: اختبارات سلوكية لـ sprint وauto-verify
        run: bash tools/test-sprint-autoverify.sh

  check-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: اختبار مناظر يونكس للسكربتات
        run: bash tools/test-platform-scripts.sh

  check-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: بوابة ما قبل النشر
        run: bash tools/pre-publish-check.sh
